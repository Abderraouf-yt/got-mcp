name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.2
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install root dependencies
              run: npm ci

            - name: Build MCP Server
              run: npm run build

            - name: Install Visualizer dependencies
              working-directory: ./visualizer
              run: npm ci

            - name: Build Visualizer
              working-directory: ./visualizer
              run: npm run build
