name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7 # v4.0.2
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install root dependencies
              run: npm ci

            - name: Build MCP Server
              run: npm run build

            - name: Install Visualizer dependencies
              working-directory: ./visualizer
              run: npm ci

            - name: Build Visualizer
              working-directory: ./visualizer
              run: npm run build
