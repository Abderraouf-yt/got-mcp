name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install root dependencies
              run: npm ci

            - name: Build MCP Server
              run: npm run build

            - name: Run root tests
              run: npm test

            - name: Install Visualizer dependencies
              working-directory: ./visualizer
              run: npm ci

            - name: Build Visualizer
              working-directory: ./visualizer
              run: npm run build
